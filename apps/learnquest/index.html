<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LearnQuest RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            /* === DESIGN TOKENS (Pixel Design System) === */
            /* Brand */
            --primary:#6366f1;--primary-light:#818cf8;--secondary:#8b5cf6;
            --accent:#f59e0b;--accent-light:#fbbf24;
            --success:#10b981;--success-light:#34d399;--danger:#ef4444;
            /* Backgrounds (near-black, never pure #000) */
            --bg-dark:#0f0a1a;--bg-card:#1a1230;--bg-light:#251840;
            /* Text (near-white, never pure #fff — improved contrast) */
            --text-primary:#F9FAFB;--text-secondary:#c4b5fd;--text-muted:#8b7baa;--border:#3d2b5e;
            /* Subjects (HSL-based, semantic) */
            --math:#3b82f6;--math-light:#60a5fa;
            --ela:#ec4899;--ela-light:#f472b6;
            --science:#10b981;--science-light:#34d399;
            --social:#f59e0b;--social-light:#fbbf24;
            /* Type Scale (Major Third 1.25x) */
            --text-xs:0.75rem;--text-sm:0.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:1.875rem;--text-4xl:2.25rem;
            /* Spacing (8px base) */
            --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
            /* Radius */
            --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:9999px;
        }
        /* Reduced motion preference */
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}}
        body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.5;font-size:var(--text-base);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

        /* Particles */
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
        .particle{position:absolute;width:4px;height:4px;background:rgba(139,92,246,.5);border-radius:50%;animation:float 15s infinite}
        @keyframes float{0%,100%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh) rotate(720deg);opacity:0}}

        .app-container{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-bottom:90px}

        /* Header — Logo (primary) > Stats (secondary) */
        .header{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));padding:var(--sp-4) var(--sp-5);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:50}
        .header-top{display:flex;justify-content:space-between;align-items:center}
        .logo{display:flex;align-items:center;gap:var(--sp-2)}
        .logo-icon{font-size:var(--text-3xl);line-height:1}
        .logo-text{font-size:var(--text-xl);font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .player-stats{display:flex;gap:var(--sp-2);align-items:center}
        .stat-badge{display:flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-3);background:var(--bg-dark);border-radius:var(--r-full);border:1px solid var(--border);font-size:var(--text-sm);font-weight:700}
        .level-badge{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-weight:800;font-size:var(--text-xs);letter-spacing:0.02em}

        /* Screens — Consistent padding using spacing tokens */
        .screen{display:none;animation:fadeIn .3s ease;padding:var(--sp-4)}
        .screen.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        /* Section Headers — 3-Level Hierarchy: Title (primary) > Date (tertiary) */
        .section-header{text-align:center;margin-bottom:var(--sp-6)}
        .section-date{color:var(--text-muted);font-size:var(--text-sm);margin-bottom:var(--sp-1);font-weight:600;letter-spacing:0.02em}
        .section-title{font-size:var(--text-2xl);font-weight:800;line-height:1.25}

        /* New Badge — Tertiary visual weight, draw eye without dominating */
        .new-badge{display:inline-flex;align-items:center;gap:var(--sp-1);background:linear-gradient(135deg,var(--success),var(--success-light));color:#fff;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-full);font-size:var(--text-xs);font-weight:700;margin-bottom:var(--sp-3);text-transform:uppercase;letter-spacing:0.03em;animation:pulse 3s ease-in-out infinite}
        @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.02);opacity:.9}}

        /* Subject Badges — Tertiary: small, categorizing, not attention-grabbing */
        .subject-badge{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:var(--sp-3)}
        .subject-badge.math{background:rgba(59,130,246,.15);color:var(--math-light)}
        .subject-badge.ela{background:rgba(236,72,153,.15);color:var(--ela-light)}
        .subject-badge.science{background:rgba(16,185,129,.15);color:var(--science-light)}
        .subject-badge.social{background:rgba(245,158,11,.15);color:var(--social-light)}

        /* Lesson Card — Hierarchy: Title (primary) > Content (secondary) > Meta (tertiary) */
        .lesson-card{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-xl);overflow:hidden;margin-bottom:var(--sp-4)}
        .lesson-card-header{padding:var(--sp-5);border-bottom:1px solid var(--border)}
        .lesson-card-title{font-size:var(--text-xl);font-weight:800;margin-bottom:var(--sp-2);line-height:1.25}
        .lesson-card-meta{display:flex;gap:var(--sp-4);color:var(--text-muted);font-size:var(--text-sm);font-weight:600}
        .lesson-card-body{padding:var(--sp-5)}

        .lesson-section{margin-bottom:var(--sp-6)}
        .lesson-section:last-child{margin-bottom:0}
        /* Section title = tertiary (labels subordinate to content) */
        .lesson-section-title{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--text-sm);font-weight:800;margin-bottom:var(--sp-2);color:var(--primary-light);text-transform:uppercase;letter-spacing:0.03em}
        .lesson-section-content{color:var(--text-secondary);font-size:var(--text-base);line-height:1.65}

        /* Atlas Story — Warm accent distinguishes from Sol lessons */
        .atlas-card{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid rgba(245,158,11,.3);border-radius:var(--r-xl);overflow:hidden;margin-bottom:var(--sp-4)}
        .atlas-card-header{padding:var(--sp-5);border-bottom:1px solid rgba(245,158,11,.2);background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.03))}
        .atlas-card-title{font-size:var(--text-lg);font-weight:800;color:var(--accent);display:flex;align-items:center;gap:var(--sp-2);line-height:1.25}
        .atlas-card-body{padding:var(--sp-5)}
        .atlas-story-text{line-height:1.75;color:var(--text-primary);font-size:var(--text-base)}
        .atlas-section{margin-top:var(--sp-4);padding:var(--sp-4);background:var(--bg-dark);border-radius:var(--r-md)}
        .atlas-section-title{font-size:var(--text-xs);font-weight:800;color:var(--accent-light);margin-bottom:var(--sp-2);text-transform:uppercase;letter-spacing:0.05em}
        .atlas-section-content{color:var(--text-secondary);font-size:var(--text-sm);line-height:1.65}

        /* Buttons — min 48px touch target (Apple HIG), all states defined */
        .complete-btn{width:100%;padding:var(--sp-5) var(--sp-6);background:linear-gradient(135deg,var(--success),#059669);border:none;border-radius:var(--r-lg);color:#fff;font-family:'Nunito',sans-serif;font-size:var(--text-lg);font-weight:800;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-5);min-height:48px;box-shadow:0 4px 14px rgba(16,185,129,.3)}
        .complete-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,.4)}
        .complete-btn:active{transform:translateY(0) scale(.98)}
        .complete-btn:focus-visible{outline:3px solid var(--success-light);outline-offset:2px}
        .complete-btn:disabled{background:var(--bg-light);cursor:not-allowed;transform:none;box-shadow:none;opacity:.5}
        .completed-state{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);background:rgba(16,185,129,.1);border:2px solid rgba(16,185,129,.4);color:var(--success-light);padding:var(--sp-5);border-radius:var(--r-lg);font-size:var(--text-lg);font-weight:800;margin-top:var(--sp-5)}

        /* No Lesson — Empty state with clear visual hierarchy */
        .no-lesson{text-align:center;padding:var(--sp-16) var(--sp-5);color:var(--text-secondary)}
        .no-lesson-icon{font-size:64px;margin-bottom:var(--sp-4);opacity:.4}
        .no-lesson p{margin-bottom:var(--sp-2);line-height:1.5}
        .no-lesson p strong{color:var(--text-primary)}

        /* Library — Touch-friendly filters, clear hierarchy per item */
        .library-filters{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-5);overflow-x:auto;padding-bottom:var(--sp-1);-webkit-overflow-scrolling:touch;scrollbar-width:none}
        .library-filters::-webkit-scrollbar{display:none}
        .filter-btn{padding:var(--sp-2) var(--sp-4);background:var(--bg-card);border:2px solid var(--border);border-radius:var(--r-full);color:var(--text-secondary);font-family:'Nunito',sans-serif;font-weight:700;font-size:var(--text-sm);cursor:pointer;transition:all .2s ease;white-space:nowrap;min-height:40px}
        .filter-btn:hover{border-color:var(--primary)}
        .filter-btn:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
        .filter-btn.active{background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent;color:#fff}
        .library-list{display:flex;flex-direction:column;gap:var(--sp-3)}
        .library-item{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:all .2s ease;min-height:48px}
        .library-item:hover{border-color:var(--primary);transform:translateX(4px)}
        .library-item:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
        .library-item.completed{border-left:4px solid var(--success)}
        .library-item-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--sp-2)}
        .library-item-title{font-weight:700;font-size:var(--text-base);line-height:1.4;flex:1;padding-right:var(--sp-2)}
        .library-item-check{width:24px;height:24px;background:var(--success);border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#fff}
        .library-item-meta{display:flex;gap:var(--sp-3);font-size:var(--text-xs);color:var(--text-muted);align-items:center;font-weight:600}

        /* Progress — Labels subordinate to values (Pixel hierarchy rule) */
        .progress-overview{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-xl);padding:var(--sp-6);margin-bottom:var(--sp-5);text-align:center}
        .progress-total-xp{font-size:var(--text-4xl);font-weight:900;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:var(--sp-1);line-height:1}
        .progress-total-label{color:var(--text-muted);font-size:var(--text-sm);margin-bottom:var(--sp-4);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
        .progress-stats-row{display:flex;justify-content:space-around;padding-top:var(--sp-4);border-top:1px solid var(--border)}
        .progress-stat{text-align:center}
        /* Value (primary) pops; label (tertiary) recedes */
        .progress-stat-value{font-size:var(--text-2xl);font-weight:800;line-height:1;margin-bottom:var(--sp-1)}
        .progress-stat-label{font-size:var(--text-xs);color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}

        .subject-card{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-xl);padding:var(--sp-5);margin-bottom:var(--sp-4)}
        .subject-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4)}
        .subject-card-name{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--text-lg);font-weight:800}
        .subject-card-level{background:var(--bg-dark);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:700;color:var(--text-secondary)}
        .subject-bar{height:var(--sp-3);background:var(--bg-dark);border-radius:var(--r-full);overflow:hidden;margin-bottom:var(--sp-3)}
        .subject-fill{height:100%;border-radius:var(--r-full);transition:width .5s ease}
        .subject-fill.math{background:linear-gradient(90deg,var(--math),var(--math-light))}
        .subject-fill.ela{background:linear-gradient(90deg,var(--ela),var(--ela-light))}
        .subject-fill.science{background:linear-gradient(90deg,var(--science),var(--science-light))}
        .subject-fill.social{background:linear-gradient(90deg,var(--social),var(--social-light))}
        .subject-details{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--text-muted);font-weight:600}

        /* Character — Clear hierarchy: Avatar > Name > Title > XP */
        .char-header{text-align:center;margin-bottom:var(--sp-6)}
        .char-avatar{width:120px;height:120px;background:linear-gradient(135deg,var(--bg-dark),var(--bg-light));border-radius:var(--r-full);margin:0 auto var(--sp-4);display:flex;align-items:center;justify-content:center;font-size:60px;border:4px solid var(--primary);box-shadow:0 0 40px rgba(99,102,241,.3)}
        .char-title{font-size:var(--text-sm);font-weight:700;color:var(--accent);margin-bottom:var(--sp-1);text-transform:uppercase;letter-spacing:0.08em}
        .char-name{font-size:var(--text-2xl);font-weight:800}
        .xp-section{background:var(--bg-dark);border-radius:var(--r-xl);padding:var(--sp-5);margin-bottom:var(--sp-6)}
        .xp-header{display:flex;justify-content:space-between;margin-bottom:var(--sp-2);font-size:var(--text-sm);font-weight:600}
        .xp-bar{height:var(--sp-4);background:var(--bg-light);border-radius:var(--r-full);overflow:hidden}
        .xp-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--success-light));border-radius:var(--r-full);transition:width .5s ease}
        .inv-section{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-xl);padding:var(--sp-5)}
        .inv-title{font-size:var(--text-lg);font-weight:800;margin-bottom:var(--sp-4);display:flex;align-items:center;gap:var(--sp-2)}
        .inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
        .inv-item{aspect-ratio:1;background:var(--bg-dark);border:2px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease;position:relative;min-height:64px}
        .inv-item:hover{border-color:var(--primary);transform:scale(1.05)}
        .inv-item:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
        .inv-item.equipped{border-color:var(--success);background:rgba(16,185,129,.1)}
        .inv-item.equipped::after{content:'✓';position:absolute;top:var(--sp-1);right:var(--sp-1);background:var(--success);color:#fff;font-size:10px;width:16px;height:16px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-weight:800}
        .inv-item-icon{font-size:28px;line-height:1}
        .inv-item-name{font-size:9px;color:var(--text-muted);text-align:center;margin-top:var(--sp-1);font-weight:600}

        /* Modal — Accessible close button, proper touch target */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:100;display:none;align-items:flex-end;justify-content:center}
        .modal-overlay.active{display:flex}
        .modal{background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border:2px solid var(--border);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-head{padding:var(--sp-5);border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg-card);z-index:10}
        .modal-head-title{font-size:var(--text-lg);font-weight:800;flex:1;padding-right:var(--sp-2);line-height:1.25}
        .modal-close{width:44px;height:44px;border:2px solid var(--border);background:transparent;color:var(--text-primary);border-radius:var(--r-md);cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
        .modal-close:hover{background:var(--danger);border-color:var(--danger)}
        .modal-close:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
        .modal-content{padding:var(--sp-5)}

        /* Level Up — Clear hierarchy: Level # is primary, title secondary, button CTA */
        .levelup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column}
        .levelup.active{display:flex}
        .levelup-inner{text-align:center;animation:levelPulse 1.5s ease-in-out infinite}
        @keyframes levelPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        .levelup h1{font-size:var(--text-3xl);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:var(--sp-2);text-transform:uppercase;letter-spacing:0.05em}
        .levelup .num{font-size:80px;font-weight:900;color:var(--text-primary);text-shadow:0 0 40px rgba(245,158,11,.5);margin-bottom:var(--sp-2);line-height:1}
        .levelup .subtitle{font-size:var(--text-xl);color:var(--text-secondary);margin-bottom:var(--sp-8)}
        .levelup button{padding:var(--sp-5) var(--sp-10);background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;border-radius:var(--r-full);color:#fff;font-family:'Nunito',sans-serif;font-size:var(--text-lg);font-weight:800;cursor:pointer;min-height:48px;transition:all .2s ease;box-shadow:0 4px 20px rgba(99,102,241,.4)}
        .levelup button:hover{transform:translateY(-2px)}
        .levelup button:active{transform:scale(.98)}
        .levelup button:focus-visible{outline:3px solid var(--primary-light);outline-offset:4px}

        .xp-popup{position:fixed;pointer-events:none;z-index:200;font-size:28px;font-weight:900;color:var(--success);text-shadow:0 0 20px rgba(16,185,129,.5);animation:xpFloat 1.5s ease forwards}
        @keyframes xpFloat{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-30px) scale(1.2)}100%{opacity:0;transform:translateY(-120px) scale(1)}}

        .confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150}

        /* Bottom Nav — 48px min touch targets, clear active state */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--bg-card),var(--bg-light));border-top:2px solid var(--border);padding:var(--sp-2) var(--sp-4) calc(env(safe-area-inset-bottom, 8px) + var(--sp-2));z-index:100;display:flex;justify-content:space-around}
        .bnav{flex:1;padding:var(--sp-2);border:none;background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-weight:700;font-size:var(--text-xs);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:var(--r-md);transition:all .2s ease;min-height:48px;justify-content:center}
        .bnav:hover{color:var(--text-secondary)}
        .bnav:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
        .bnav.active{color:var(--primary-light);background:rgba(99,102,241,.12)}
        .bnav .icon{font-size:22px;line-height:1}
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <div class="logo">
                    <span class="logo-icon">⚔️</span>
                    <span class="logo-text">LearnQuest</span>
                </div>
                <div class="player-stats">
                    <div class="stat-badge"><span>💎</span><span id="gemsDisplay">0</span></div>
                    <div class="level-badge" id="levelDisplay">Lv. 1</div>
                </div>
            </div>
        </div>

        <div class="screen active" id="dailyScreen">
            <div class="section-header">
                <div class="section-date" id="dailyDate"></div>
                <div class="section-title">Today's Lessons</div>
            </div>
            <div id="dailyContent"><div class="loading"><div class="loading-spinner"></div><p>Loading...</p></div></div>
        </div>

        <div class="screen" id="libraryScreen">
            <div class="section-header"><div class="section-title">📚 Lesson Library</div></div>
            <div class="library-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="math">🔢 Math</button>
                <button class="filter-btn" data-filter="ela">📚 ELA</button>
                <button class="filter-btn" data-filter="science">🔬 Science</button>
                <button class="filter-btn" data-filter="social">🌍 History</button>
            </div>
            <div class="library-list" id="libraryList"></div>
        </div>

        <div class="screen" id="progressScreen">
            <div class="section-header"><div class="section-title">📊 Progress</div></div>
            <div class="progress-overview">
                <div class="progress-total-xp" id="totalXP">0</div>
                <div class="progress-total-label">Total XP Earned</div>
                <div class="progress-stats-row">
                    <div class="progress-stat"><div class="progress-stat-value" id="totalLessons">0</div><div class="progress-stat-label">Lessons</div></div>
                    <div class="progress-stat"><div class="progress-stat-value" id="currentStreak">0</div><div class="progress-stat-label">Streak</div></div>
                    <div class="progress-stat"><div class="progress-stat-value" id="badgesCount">0</div><div class="progress-stat-label">Badges</div></div>
                </div>
            </div>
            <div id="subjectCards"></div>
        </div>

        <div class="screen" id="characterScreen">
            <div class="char-header">
                <div class="char-avatar" id="charAvatar">🧙‍♂️</div>
                <div class="char-title" id="charTitle">Apprentice</div>
                <div class="char-name">Adventurer</div>
            </div>
            <div class="xp-section">
                <div class="xp-header"><span>Level Progress</span><span id="xpText">0 / 500 XP</span></div>
                <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
            </div>
            <div class="inv-section">
                <div class="inv-title">🎒 Inventory</div>
                <div class="inv-grid" id="invGrid"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="bnav active" data-screen="daily"><span class="icon">📖</span><span>Today</span></button>
        <button class="bnav" data-screen="library"><span class="icon">📚</span><span>Library</span></button>
        <button class="bnav" data-screen="progress"><span class="icon">📊</span><span>Progress</span></button>
        <button class="bnav" data-screen="character"><span class="icon">🧙</span><span>Character</span></button>
    </div>

    <div class="modal-overlay" id="lessonModal">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-head-title" id="modalTitle"></div>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <div class="levelup" id="levelUp">
        <div class="levelup-inner">
            <h1>LEVEL UP!</h1>
            <div class="num" id="levelUpNum">2</div>
            <div class="subtitle" id="levelUpTitle">Apprentice</div>
            <button id="levelUpBtn">Continue!</button>
        </div>
    </div>

    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<script>
// ============================================
// LEARNQUEST RPG v2.0 — Daily-Focused Engine
// ============================================

const API_BASE = location.origin;
const SUBJECT_INFO = {
    math:    { icon: '🔢', name: 'Math Realm',     color: 'math' },
    ela:     { icon: '📚', name: 'Literary Lands',  color: 'ela' },
    science: { icon: '🔬', name: 'Science Sector',  color: 'science' },
    social:  { icon: '🌍', name: 'History Kingdom', color: 'social' }
};

const XP_BASE = 500;
const XP_EXP = 1.5;
function xpForLevel(l) { return Math.floor(XP_BASE * Math.pow(l, XP_EXP)); }
function titleForLevel(l) {
    if (l >= 21) return 'Legend';
    if (l >= 16) return 'Master';
    if (l >= 11) return 'Scholar';
    if (l >= 6) return 'Explorer';
    return 'Apprentice';
}

const ITEMS = [
    {id:'wizard_hat',icon:'🧙',name:'Wizard Hat',type:'hat'},
    {id:'crown',icon:'👑',name:'Royal Crown',type:'hat'},
    {id:'sword',icon:'⚔️',name:'Hero Sword',type:'weapon'},
    {id:'wand',icon:'🪄',name:'Magic Wand',type:'weapon'},
    {id:'shield',icon:'🛡️',name:'Guard Shield',type:'shield'},
    {id:'potion',icon:'🧪',name:'Power Potion',type:'item'},
    {id:'cape',icon:'🦸',name:'Hero Cape',type:'armor'},
    {id:'robe',icon:'👘',name:'Mage Robe',type:'armor'},
    {id:'crystal',icon:'🔮',name:'Crystal Ball',type:'item'},
    {id:'book',icon:'📖',name:'Spell Book',type:'item'},
    {id:'boots',icon:'👢',name:'Swift Boots',type:'armor'},
    {id:'ring',icon:'💍',name:'Power Ring',type:'accessory'}
];

const MILESTONES = {3:'shield',5:'cape',8:'wand',10:'crystal',12:'crown',15:'robe',18:'book',20:'boots',25:'ring'};

// === STATE ===
let state = {
    player: { level:1, xp:0, xpToNext: xpForLevel(2), gems:0, avatar:'🧙‍♂️', title:'Apprentice' },
    subjectStats: { math:{xp:0,lessons:0,level:1}, ela:{xp:0,lessons:0,level:1}, science:{xp:0,lessons:0,level:1}, social:{xp:0,lessons:0,level:1} },
    completedLessons: [], // Array of lesson IDs
    badges: [],
    inventory: ['wizard_hat','sword','potion'],
    equipped: {hat:'wizard_hat',weapon:'sword'},
    streak: { lastDate:null, count:0 }
};

let allLessons = []; // From API

// === PERSISTENCE ===
function save() { localStorage.setItem('learnquest2', JSON.stringify(state)); }
function load() {
    const s = localStorage.getItem('learnquest2');
    if (s) { const p = JSON.parse(s); state = {...state, ...p}; }
    // Migrate from v1
    if (!s) {
        const old = localStorage.getItem('learnQuestState');
        if (old) {
            const o = JSON.parse(old);
            state.player = {...state.player, ...o.player};
            state.completedLessons = o.completedLessons || [];
            state.inventory = o.inventory || state.inventory;
            state.equipped = o.equipped || state.equipped;
            if (o.stats) {
                ['math','ela','science','social'].forEach(s => {
                    state.subjectStats[s].level = o.stats[s] || 1;
                });
            }
            save();
        }
    }
}

// === API ===
async function fetchLessons() {
    try {
        const r = await fetch(API_BASE + '/api/lessons');
        if (!r.ok) throw new Error('API error');
        const d = await r.json();
        allLessons = d.lessons || [];
    } catch(e) {
        console.warn('API fetch failed:', e);
        allLessons = [];
    }
}

function getToday() {
    // Use Pacific timezone (America/Los_Angeles) to match Evaan's location
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
}

function getTodaysLessons() {
    const today = getToday();
    return allLessons.filter(l => l.date === today);
}

function isCompleted(id) {
    return state.completedLessons.includes(id);
}

// === DAILY SCREEN ===
function renderDaily() {
    const el = document.getElementById('dailyContent');
    const dateEl = document.getElementById('dailyDate');
    const today = new Date();
    dateEl.textContent = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

    const todaysLessons = getTodaysLessons();
    
    if (todaysLessons.length === 0) {
        el.innerHTML = '<div class="no-lesson"><div class="no-lesson-icon">🌙</div><p><strong>No new lessons today</strong></p><p>Check back tomorrow for a new adventure!</p><p style="margin-top:16px;font-size:13px">Or revisit past lessons in the Library tab 📚</p></div>';
        return;
    }

    let html = '';
    
    // Separate Sol lessons and Atlas stories
    const solLessons = todaysLessons.filter(l => l.id.startsWith('sol-'));
    const atlasLessons = todaysLessons.filter(l => l.id.startsWith('atlas-'));

    // Render Sol lessons
    solLessons.forEach(lesson => {
        const subj = SUBJECT_INFO[lesson.subject] || SUBJECT_INFO.math;
        const done = isCompleted(lesson.id);
        
        html += '<div class="lesson-card">';
        html += '<div class="lesson-card-header">';
        if (!done) html += '<div class="new-badge">✨ New Lesson!</div>';
        html += '<div class="subject-badge ' + subj.color + '">' + subj.icon + ' ' + subj.name + '</div>';
        html += '<div class="lesson-card-title">' + esc(lesson.title) + '</div>';
        html += '<div class="lesson-card-meta"><span>⏱ ' + (lesson.duration || '15-20 min') + '</span><span>⭐ ' + (lesson.xp || 50) + ' XP</span></div>';
        html += '</div>';
        html += '<div class="lesson-card-body">';

        const c = lesson.content || {};
        if (c.hook) html += '<div class="lesson-section"><div class="lesson-section-title">🎣 The Hook</div><div class="lesson-section-content">' + esc(c.hook) + '</div></div>';
        if (c.concept) html += '<div class="lesson-section"><div class="lesson-section-title">🔍 Discover</div><div class="lesson-section-content">' + esc(c.concept) + '</div></div>';
        if (c.examples && c.examples.length) {
            html += '<div class="lesson-section"><div class="lesson-section-title">📝 Examples</div><div class="lesson-section-content">';
            c.examples.forEach(ex => { html += '• ' + esc(ex) + '<br>'; });
            html += '</div></div>';
        }
        if (c.activity) html += '<div class="lesson-section"><div class="lesson-section-title">🎮 Try It</div><div class="lesson-section-content">' + esc(c.activity) + '</div></div>';
        if (c.challenge) html += '<div class="lesson-section"><div class="lesson-section-title">🌊 Challenge</div><div class="lesson-section-content">' + esc(c.challenge) + '</div></div>';
        if (c.wonder_question) html += '<div class="lesson-section"><div class="lesson-section-title">💭 I Wonder...</div><div class="lesson-section-content">' + esc(c.wonder_question) + '</div></div>';
        if (c.parentNote || c.parent_note) html += '<div class="lesson-section"><div class="lesson-section-title">👨‍👩‍👦 For Parents</div><div class="lesson-section-content">' + esc(c.parentNote || c.parent_note) + '</div></div>';

        if (done) {
            html += '<div class="completed-state">✅ Lesson Completed!</div>';
        } else {
            html += '<button class="complete-btn" onclick="completeLesson(\'' + lesson.id + '\',\'' + lesson.subject + '\',' + (lesson.xp||50) + ')">✨ Complete Lesson (+' + (lesson.xp||50) + ' XP)</button>';
        }

        html += '</div></div>';
    });

    // Render Atlas stories
    atlasLessons.forEach(lesson => {
        const done = isCompleted(lesson.id);
        const c = lesson.content || {};
        
        html += '<div class="atlas-card">';
        html += '<div class="atlas-card-header">';
        if (!done) html += '<div class="new-badge">📖 New Story!</div>';
        html += '<div class="atlas-card-title">🏛️ ' + esc(lesson.title) + '</div>';
        if (lesson.character) {
            const charName = typeof lesson.character === 'string' ? lesson.character : lesson.character.name;
            html += '<div style="color:var(--text-secondary);font-size:14px;margin-top:8px">' + esc(lesson.setting || '') + '</div>';
        }
        html += '</div>';
        html += '<div class="atlas-card-body">';
        
        // Story content with paragraph breaks
        if (c.hook) {
            html += '<div class="atlas-story-text" style="margin-bottom:var(--sp-4)">' + formatStory(c.hook) + '</div>';
        }
        if (c.story) {
            html += '<div class="atlas-story-text">' + formatStory(c.story) + '</div>';
        }
        
        if (c.moral || c.wisdom) {
            html += '<div class="atlas-section"><div class="atlas-section-title">💡 The Wisdom</div><div class="atlas-section-content">' + formatStory(c.moral || c.wisdom) + '</div></div>';
        }
        if (c.yourTurn) {
            html += '<div class="atlas-section"><div class="atlas-section-title">🤔 Your Turn</div><div class="atlas-section-content">' + formatStory(c.yourTurn) + '</div></div>';
        }
        if (c.discussion) {
            html += '<div class="atlas-section"><div class="atlas-section-title">💬 Think About It</div><div class="atlas-section-content">' + formatStory(c.discussion) + '</div></div>';
        }
        if (c.dinnerDiscussion) {
            html += '<div class="atlas-section"><div class="atlas-section-title">🍽️ Dinner Talk</div><div class="atlas-section-content">' + formatStory(c.dinnerDiscussion) + '</div></div>';
        }
        if (c.parentNote || c.parent_note) {
            html += '<div class="atlas-section"><div class="atlas-section-title">👨‍👩‍👦 For Parents</div><div class="atlas-section-content">' + formatStory(c.parentNote || c.parent_note) + '</div></div>';
        }

        if (done) {
            html += '<div class="completed-state">✅ Story Complete!</div>';
        } else {
            html += '<button class="complete-btn" onclick="completeLesson(\'' + lesson.id + '\',\'social\',50)" style="background:linear-gradient(135deg,var(--accent),#d97706)">📖 Mark as Read (+50 XP)</button>';
        }

        html += '</div></div>';
    });

    el.innerHTML = html;
}

// === LIBRARY SCREEN ===
let libraryFilter = 'all';

function renderLibrary() {
    const el = document.getElementById('libraryList');
    let filtered = allLessons;
    if (libraryFilter !== 'all') {
        filtered = allLessons.filter(l => {
            if (libraryFilter === 'social') return l.id.startsWith('atlas-') || l.subject === 'social';
            return l.subject === libraryFilter;
        });
    }
    
    if (filtered.length === 0) {
        el.innerHTML = '<div class="no-lesson"><p>No lessons found</p></div>';
        return;
    }

    el.innerHTML = filtered.map(l => {
        const subj = l.id.startsWith('atlas-') ? 'social' : (l.subject || 'math');
        const info = SUBJECT_INFO[subj] || SUBJECT_INFO.math;
        const done = isCompleted(l.id);
        const type = l.id.startsWith('atlas-') ? '📖 Story' : '📝 Lesson';
        return '<div class="library-item' + (done ? ' completed' : '') + '" onclick="openLibraryLesson(\'' + l.id + '\')">'
            + '<div class="library-item-row">'
            + '<div class="library-item-title">' + esc(l.title) + '</div>'
            + (done ? '<div class="library-item-check">✓</div>' : '')
            + '</div>'
            + '<div class="library-item-meta">'
            + '<span class="library-item-subject ' + info.color + '">' + info.icon + ' ' + info.name + '</span>'
            + '<span>' + type + '</span>'
            + '<span>' + (l.date || '') + '</span>'
            + '</div></div>';
    }).join('');
}

function openLibraryLesson(id) {
    const lesson = allLessons.find(l => l.id === id);
    if (!lesson) return;
    
    const modal = document.getElementById('lessonModal');
    document.getElementById('modalTitle').textContent = lesson.title;
    
    const c = lesson.content || {};
    let html = '';
    const isAtlas = id.startsWith('atlas-');
    
    if (isAtlas) {
        if (c.hook) html += '<div class="atlas-story-text" style="margin-bottom:var(--sp-4)">' + formatStory(c.hook) + '</div>';
        if (c.story) html += '<div class="atlas-story-text" style="margin-bottom:var(--sp-4)">' + formatStory(c.story) + '</div>';
        if (c.moral || c.wisdom) html += '<div class="atlas-section"><div class="atlas-section-title">💡 The Wisdom</div><div class="atlas-section-content">' + formatStory(c.moral || c.wisdom) + '</div></div>';
        if (c.yourTurn) html += '<div class="atlas-section"><div class="atlas-section-title">🤔 Your Turn</div><div class="atlas-section-content">' + formatStory(c.yourTurn) + '</div></div>';
        if (c.discussion) html += '<div class="atlas-section"><div class="atlas-section-title">💬 Think About It</div><div class="atlas-section-content">' + formatStory(c.discussion) + '</div></div>';
        if (c.dinnerDiscussion) html += '<div class="atlas-section"><div class="atlas-section-title">🍽️ Dinner Talk</div><div class="atlas-section-content">' + formatStory(c.dinnerDiscussion) + '</div></div>';
    } else {
        if (c.hook) html += '<div class="lesson-section"><div class="lesson-section-title">🎣 The Hook</div><div class="lesson-section-content">' + esc(c.hook) + '</div></div>';
        if (c.concept) html += '<div class="lesson-section"><div class="lesson-section-title">🔍 Discover</div><div class="lesson-section-content">' + esc(c.concept) + '</div></div>';
        if (c.activity) html += '<div class="lesson-section"><div class="lesson-section-title">🎮 Try It</div><div class="lesson-section-content">' + esc(c.activity) + '</div></div>';
        if (c.challenge) html += '<div class="lesson-section"><div class="lesson-section-title">🌊 Challenge</div><div class="lesson-section-content">' + esc(c.challenge) + '</div></div>';
    }

    const done = isCompleted(id);
    const subj = isAtlas ? 'social' : (lesson.subject || 'math');
    if (done) {
        html += '<div class="completed-state">✅ Completed</div>';
    } else {
        html += '<button class="complete-btn" onclick="completeLesson(\'' + id + '\',\'' + subj + '\',' + (lesson.xp||50) + ');closeModal()">✨ Complete (+' + (lesson.xp||50) + ' XP)</button>';
    }

    document.getElementById('modalContent').innerHTML = html;
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('lessonModal').classList.remove('active');
}

// === PROGRESS SCREEN ===
function renderProgress() {
    document.getElementById('totalXP').textContent = state.player.xp + Object.values(state.subjectStats).reduce((a,s) => a + s.xp, 0);
    document.getElementById('totalLessons').textContent = state.completedLessons.length;
    document.getElementById('currentStreak').textContent = state.streak.count;
    document.getElementById('badgesCount').textContent = state.badges.length;

    const el = document.getElementById('subjectCards');
    el.innerHTML = Object.entries(SUBJECT_INFO).map(([key, info]) => {
        const s = state.subjectStats[key];
        const nextLevelXP = s.level * 200;
        const pct = Math.min((s.xp / nextLevelXP) * 100, 100);
        return '<div class="subject-card">'
            + '<div class="subject-card-header">'
            + '<div class="subject-card-name">' + info.icon + ' ' + info.name + '</div>'
            + '<div class="subject-card-level">Lv. ' + s.level + '</div>'
            + '</div>'
            + '<div class="subject-bar"><div class="subject-fill ' + info.color + '" style="width:' + pct + '%"></div></div>'
            + '<div class="subject-details"><span>' + s.xp + ' / ' + nextLevelXP + ' XP</span><span>' + s.lessons + ' lessons</span></div>'
            + '</div>';
    }).join('');
}

// === CHARACTER SCREEN ===
function renderCharacter() {
    document.getElementById('charAvatar').textContent = state.player.avatar;
    document.getElementById('charTitle').textContent = state.player.title;
    const pct = (state.player.xp / state.player.xpToNext) * 100;
    document.getElementById('xpFill').style.width = pct + '%';
    document.getElementById('xpText').textContent = state.player.xp + ' / ' + state.player.xpToNext + ' XP';

    const grid = document.getElementById('invGrid');
    grid.innerHTML = state.inventory.map(id => {
        const item = ITEMS.find(i => i.id === id);
        if (!item) return '';
        const eq = Object.values(state.equipped).includes(id);
        return '<div class="inv-item' + (eq?' equipped':'') + '" onclick="toggleEquip(\'' + id + '\')">'
            + '<div class="inv-item-icon">' + item.icon + '</div>'
            + '<div class="inv-item-name">' + item.name + '</div></div>';
    }).join('');
}

function toggleEquip(id) {
    const item = ITEMS.find(i => i.id === id);
    if (!item) return;
    if (state.equipped[item.type] === id) delete state.equipped[item.type];
    else state.equipped[item.type] = id;
    updateAvatar();
    save();
    renderCharacter();
}

function updateAvatar() {
    if (state.equipped.hat === 'crown') { state.player.avatar = '👑'; return; }
    if (state.equipped.hat === 'wizard_hat') { state.player.avatar = '🧙‍♂️'; return; }
    if (state.equipped.armor === 'cape') { state.player.avatar = '🦸'; return; }
    state.player.avatar = '🧙‍♂️';
}

// === COMPLETE LESSON ===
function completeLesson(id, subject, xp) {
    if (isCompleted(id)) return;
    state.completedLessons.push(id);

    // XP
    state.player.xp += xp;
    state.player.gems += 5;
    
    // Subject stats
    const ss = state.subjectStats[subject];
    if (ss) {
        ss.xp += xp;
        ss.lessons++;
        const nextLevelXP = ss.level * 200;
        if (ss.xp >= nextLevelXP) {
            ss.xp -= nextLevelXP;
            ss.level++;
        }
    }

    // Streak
    const today = getToday();
    if (state.streak.lastDate !== today) {
        // Calculate yesterday in Pacific timezone
        const now = new Date();
        const yesterday = new Date(now.getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
        state.streak.count = (state.streak.lastDate === yesterday) ? state.streak.count + 1 : 1;
        state.streak.lastDate = today;
    }

    // Badges from lesson
    const lesson = allLessons.find(l => l.id === id);
    if (lesson && lesson.badges) {
        lesson.badges.forEach(b => { if (!state.badges.includes(b)) state.badges.push(b); });
    }

    // Milestone items
    const total = state.completedLessons.length;
    if (MILESTONES[total] && !state.inventory.includes(MILESTONES[total])) {
        state.inventory.push(MILESTONES[total]);
    }

    // Level up check
    const didLevel = checkLevelUp();

    showXPPopup(xp);
    fireConfetti();
    save();
    setTimeout(() => renderAll(), didLevel ? 2500 : 500);
}

function checkLevelUp() {
    if (state.player.xp >= state.player.xpToNext) {
        state.player.xp -= state.player.xpToNext;
        state.player.level++;
        state.player.xpToNext = xpForLevel(state.player.level + 1);
        state.player.title = titleForLevel(state.player.level);
        save();
        showLevelUp();
        return true;
    }
    return false;
}

function showLevelUp() {
    document.getElementById('levelUpNum').textContent = state.player.level;
    document.getElementById('levelUpTitle').textContent = state.player.title;
    document.getElementById('levelUp').classList.add('active');
    fireConfetti();
}

// === HEADER ===
function renderHeader() {
    document.getElementById('gemsDisplay').textContent = state.player.gems;
    document.getElementById('levelDisplay').textContent = 'Lv. ' + state.player.level;
}

// === RENDER ALL ===
function renderAll() {
    renderHeader();
    renderDaily();
    renderLibrary();
    renderProgress();
    renderCharacter();
}

// === NAVIGATION ===
function setupNav() {
    document.querySelectorAll('.bnav').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.bnav').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(btn.dataset.screen + 'Screen').classList.add('active');
        });
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            libraryFilter = btn.dataset.filter;
            renderLibrary();
        });
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('lessonModal').addEventListener('click', e => { if (e.target.id === 'lessonModal') closeModal(); });
    document.getElementById('levelUpBtn').addEventListener('click', () => { document.getElementById('levelUp').classList.remove('active'); renderAll(); });
}

// === PARTICLES ===
function createParticles() {
    const c = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random()*100+'%';
        p.style.animationDelay = Math.random()*15+'s';
        p.style.animationDuration = (10+Math.random()*10)+'s';
        c.appendChild(p);
    }
}

// === CONFETTI ===
const confCanvas = document.getElementById('confettiCanvas');
const confCtx = confCanvas.getContext('2d');
let confParts = [];

function fireConfetti() {
    confCanvas.width = window.innerWidth;
    confCanvas.height = window.innerHeight;
    const colors = ['#6366f1','#8b5cf6','#f59e0b','#10b981','#ec4899','#3b82f6','#ef4444'];
    for (let i = 0; i < 100; i++) {
        confParts.push({
            x: confCanvas.width/2+(Math.random()-.5)*200,
            y: confCanvas.height/2,
            vx: (Math.random()-.5)*20,
            vy: (Math.random()-1)*20-5,
            color: colors[Math.floor(Math.random()*colors.length)],
            size: Math.random()*8+4,
            rotation: Math.random()*360,
            rotSpeed: (Math.random()-.5)*10,
            gravity: .4+Math.random()*.2,
            drag: .96
        });
    }
    animateConf();
}

function animateConf() {
    confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
    for (let i=confParts.length-1;i>=0;i--) {
        const p=confParts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=p.drag;p.vy*=p.drag;p.rotation+=p.rotSpeed;
        confCtx.save();confCtx.translate(p.x,p.y);confCtx.rotate(p.rotation*Math.PI/180);
        confCtx.fillStyle=p.color;confCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size);confCtx.restore();
        if(p.y>confCanvas.height+60) confParts.splice(i,1);
    }
    if(confParts.length>0) requestAnimationFrame(animateConf);
}

function showXPPopup(amount) {
    const el = document.createElement('div');
    el.className = 'xp-popup';
    el.textContent = '+' + amount + ' XP';
    el.style.left = (40+Math.random()*20)+'%';
    el.style.top = '40%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
}

function esc(s) { if (!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// Format story text with paragraph breaks (converts \\n to <br>)
function formatStory(s) { 
    if (!s) return ''; 
    const escaped = esc(s);
    return escaped.replace(/\\n/g, '<br>');
}

// === INIT ===
async function init() {
    load();
    createParticles();
    setupNav();
    window.addEventListener('resize', () => { confCanvas.width=window.innerWidth; confCanvas.height=window.innerHeight; });
    confCanvas.width=window.innerWidth; confCanvas.height=window.innerHeight;

    await fetchLessons();
    renderAll();
    console.log('🎮 LearnQuest v2.0 | Level:', state.player.level, '| Lessons:', state.completedLessons.length);
}

document.addEventListener('DOMContentLoaded', init);
</script>
