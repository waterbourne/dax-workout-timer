<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="xpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="70%" stop-color="#F9CA24"/>
      <stop offset="100%" stop-color="#E8B5A8"/>
    </radialGradient>
    <linearGradient id="xpStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Starburst -->
  <g transform="translate(24, 24)">
    <polygon points="0,-22 3,-8 18,-12 6,-2 22,8 5,6 8,22 0,10 -8,22 -5,6 -22,8 -6,-2 -18,-12 -3,-8" 
             fill="url(#xpGlow)" stroke="#F9CA24" stroke-width="2"/>
  </g>
  
  <!-- Inner Circle -->
  <circle cx="24" cy="24" r="12" fill="#FFD93D" stroke="#F9CA24" stroke-width="2"/>
  <circle cx="24" cy="24" r="8" fill="url(#xpStar)" stroke="#F9CA24" stroke-width="1"/>
  
  <!-- XP Text -->
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2D3561">XP</text>
  
  <!-- Sparkles -->
  <circle cx="8" cy="12" r="2" fill="#FFFFFF"/>
  <circle cx="40" cy="15" r="2" fill="#FFFFFF"/>
  <circle cx="12" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="38" cy="38" r="2" fill="#FFFFFF"/>
</svg>