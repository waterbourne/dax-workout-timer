<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E0D5"/>
      <stop offset="50%" stop-color="#D4C5B0"/>
      <stop offset="100%" stop-color="#A89580"/>
    </linearGradient>
    <linearGradient id="ancientGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="400" fill="url(#skyGrad)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 200 L50 150 L100 180 L150 120 L200 160 L250 100 L300 150 L350 110 L400 180 L400 400 L0 400 Z" 
        fill="#4A4E8C" opacity="0.5" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Main Ruin Pillar Left -->
  <g transform="translate(40, 100)">
    <rect x="0" y="200" width="80" height="100" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <rect x="10" y="50" width="60" height="150" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <rect x="5" y="30" width="70" height="20" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <path d="M10 30 L20 10 L40 20 L60 5 L70 30 Z" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <!-- Timeline Carving -->
    <rect x="18" y="60" width="44" height="100" fill="#F5DEB3" opacity="0.7" stroke="#8B7355" stroke-width="2"/>
    <line x1="25" y1="70" x2="55" y2="70" stroke="#8B7355" stroke-width="2"/>
    <circle cx="30" cy="70" r="4" fill="#FFD93D" stroke="#2D3561" stroke-width="1"/>
    <text x="35" y="74" font-family="Arial, sans-serif" font-size="8" fill="#2D3561">1000</text>
    <line x1="25" y1="95" x2="55" y2="95" stroke="#8B7355" stroke-width="2"/>
    <circle cx="40" cy="95" r="4" fill="#4ECDC4" stroke="#2D3561" stroke-width="1"/>
    <text x="45" y="99" font-family="Arial, sans-serif" font-size="8" fill="#2D3561">1500</text>
    <line x1="25" y1="120" x2="55" y2="120" stroke="#8B7355" stroke-width="2"/>
    <circle cx="35" cy="120" r="4" fill="#FF6B6B" stroke="#2D3561" stroke-width="1"/>
    <text x="40" y="124" font-family="Arial, sans-serif" font-size="8" fill="#2D3561">1800</text>
    <line x1="25" y1="145" x2="55" y2="145" stroke="#8B7355" stroke-width="2"/>
    <circle cx="45" cy="145" r="4" fill="#6B5B95" stroke="#2D3561" stroke-width="1"/>
    <text x="25" y="149" font-family="Arial, sans-serif" font-size="8" fill="#2D3561">2025</text>
  </g>
  
  <!-- Main Ruin Pillar Right -->
  <g transform="translate(280, 120)">
    <rect x="0" y="180" width="80" height="100" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <rect x="10" y="30" width="60" height="150" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <rect x="5" y="10" width="70" height="20" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <path d="M5 10 L15 0 L35 8 L55 0 L65 10 Z" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="3"/>
    <rect x="18" y="40" width="44" height="100" fill="#F5DEB3" opacity="0.7" stroke="#8B7355" stroke-width="2"/>
    <line x1="25" y1="50" x2="55" y2="50" stroke="#8B7355" stroke-width="2"/>
    <circle cx="30" cy="50" r="4" fill="#FFD93D" stroke="#2D3561" stroke-width="1"/>
    <line x1="25" y1="75" x2="55" y2="75" stroke="#8B7355" stroke-width="2"/>
    <circle cx="45" cy="75" r="4" fill="#4ECDC4" stroke="#2D3561" stroke-width="1"/>
    <line x1="25" y1="100" x2="55" y2="100" stroke="#8B7355" stroke-width="2"/>
    <circle cx="35" cy="100" r="4" fill="#FF6B6B" stroke="#2D3561" stroke-width="1"/>
  </g>
  
  <!-- Broken Arch -->
  <g transform="translate(140, 80)">
    <path d="M0 200 L20 120 Q60 60 100 120 L120 200" fill="none" stroke="url(#stoneGrad)" stroke-width="20"/>
    <path d="M0 200 L20 120 Q60 60 100 120 L120 200" fill="none" stroke="#4A4A4A" stroke-width="3"/>
  </g>
  
  <!-- Floating Scrolls -->
  <g transform="translate(160, 40)" opacity="0.9">
    <rect x="0" y="0" width="40" height="50" fill="#F5DEB3" stroke="#8B7355" stroke-width="2" transform="rotate(-10)"/>
    <rect x="5" y="5" width="30" height="40" fill="none" stroke="#8B7355" stroke-width="1" transform="rotate(-10)"/>
    <line x1="10" y1="15" x2="30" y2="15" stroke="#8B7355" stroke-width="1" transform="rotate(-10)"/>
    <line x1="10" y1="25" x2="30" y2="25" stroke="#8B7355" stroke-width="1" transform="rotate(-10)"/>
    <line x1="10" y1="35" x2="25" y2="35" stroke="#8B7355" stroke-width="1" transform="rotate(-10)"/>
  </g>
  
  <g transform="translate(220, 60)" opacity="0.85">
    <rect x="0" y="0" width="35" height="45" fill="#F5DEB3" stroke="#8B7355" stroke-width="2" transform="rotate(15)"/>
    <rect x="3" y="4" width="27" height="35" fill="none" stroke="#8B7355" stroke-width="1" transform="rotate(15)"/>
    <line x1="7" y1="12" x2="27" y2="12" stroke="#8B7355" stroke-width="1" transform="rotate(15)"/>
    <line x1="7" y1="20" x2="27" y2="20" stroke="#8B7355" stroke-width="1" transform="rotate(15)"/>
  </g>
  
  <!-- Ancient Symbols -->
  <g transform="translate(200, 280)">
    <text x="0" y="0" font-family="serif" font-size="24" fill="url(#ancientGold)" stroke="#B8860B" stroke-width="1">★</text>
  </g>
  <g transform="translate(150, 320)">
    <text x="0" y="0" font-family="serif" font-size="20" fill="url(#ancientGold)" stroke="#B8860B" stroke-width="1">⚜</text>
  </g>
  <g transform="translate(250, 310)">
    <text x="0" y="0" font-family="serif" font-size="22" fill="url(#ancientGold)" stroke="#B8860B" stroke-width="1">⚔</text>
  </g>
  
  <!-- Ruined Stones on Ground -->
  <path d="M20 350 L50 330 L80 350 Z" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="2"/>
  <path d="M320 360 L360 340 L390 360 Z" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="2"/>
  <rect x="180" y="370" width="40" height="30" fill="url(#stoneGrad)" stroke="#4A4A4A" stroke-width="2"/>
</svg>