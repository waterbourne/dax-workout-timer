<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlBody3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E8C"/>
      <stop offset="50%" stop-color="#3A3E7C"/>
      <stop offset="100%" stop-color="#2D2D5C"/>
    </linearGradient>
    <linearGradient id="owlBelly3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E8D8"/>
      <stop offset="100%" stop-color="#D8C8B0"/>
    </linearGradient>
    <linearGradient id="wiseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Branch -->
  <rect x="15" y="125" width="120" height="12" fill="#654321" stroke="#2D3561" stroke-width="2"/>
  <circle cx="30" cy="128" r="8" fill="#4A3728"/>
  <circle cx="120" cy="128" r="6" fill="#4A3728"/>
  
  <!-- Feet (wise grip) -->
  <ellipse cx="58" cy="118" rx="10" ry="14" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
  <ellipse cx="92" cy="118" rx="10" ry="14" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
  <path d="M52 115 L48 128 M58 115 L58 130 M64 115 L68 128" stroke="#2D3561" stroke-width="2"/>
  <path d="M86 115 L82 128 M92 115 L92 130 M98 115 L102 128" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="75" cy="88" rx="42" ry="46" fill="url(#owlBody3)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Belly (ancient patterns) -->
  <ellipse cx="75" cy="93" rx="28" ry="34" fill="url(#owlBelly3)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Ancient Feather Patterns -->
  <path d="M60 75 Q75 70 90 75" fill="none" stroke="#4A4E8C" stroke-width="1.5"/>
  <path d="M58 85 Q75 80 92 85" fill="none" stroke="#4A4E8C" stroke-width="1.5"/>
  <path d="M60 95 Q75 90 90 95" fill="none" stroke="#4A4E8C" stroke-width="1.5"/>
  <path d="M65 105 Q75 100 85 105" fill="none" stroke="#4A4E8C" stroke-width="1.5"/>
  
  <!-- Wings (ornate) -->
  <ellipse cx="34" cy="85" rx="14" ry="32" fill="#3A3E7C" stroke="#2D3561" stroke-width="2"/>
  <path d="M30 65 L38 65 M28 75 L40 75 M28 85 L40 85 M30 95 L38 95" stroke="#FFD93D" stroke-width="1.5"/>
  <ellipse cx="116" cy="85" rx="14" ry="32" fill="#3A3E7C" stroke="#2D3561" stroke-width="2"/>
  <path d="M112 65 L120 65 M110 75 L122 75 M110 85 L122 85 M112 95 L120 95" stroke="#FFD93D" stroke-width="1.5"/>
  
  <!-- Head (larger, wiser) -->
  <circle cx="75" cy="45" r="42" fill="url(#owlBody3)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Eye Discs (gold rimmed) -->
  <circle cx="52" cy="45" r="24" fill="#F0E8D8" stroke="url(#wiseGold)" stroke-width="4"/>
  <circle cx="98" cy="45" r="24" fill="#F0E8D8" stroke="url(#wiseGold)" stroke-width="4"/>
  
  <!-- Wise Eyes (knowing look) -->
  <circle cx="52" cy="45" r="16" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
  <circle cx="52" cy="45" r="11" fill="#FFD93D"/>
  <circle cx="52" cy="45" r="6" fill="#2D3561"/>
  <circle cx="55" cy="42" r="4" fill="#FFFFFF"/>
  <!-- Eyelids (wise half-closed) -->
  <path d="M34 40 Q52 38 70 40" fill="none" stroke="#4A4E8C" stroke-width="2"/>
  
  <circle cx="98" cy="45" r="16" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
  <circle cx="98" cy="45" r="11" fill="#FFD93D"/>
  <circle cx="98" cy="45" r="6" fill="#2D3561"/>
  <circle cx="101" cy="42" r="4" fill="#FFFFFF"/>
  <!-- Eyelids -->
  <path d="M80 40 Q98 38 116 40" fill="none" stroke="#4A4E8C" stroke-width="2"/>
  
  <!-- Wise Eyebrows -->
  <path d="M38 28 Q52 22 66 28" fill="none" stroke="#DAA520" stroke-width="3"/>
  <path d="M84 28 Q98 22 112 28" fill="none" stroke="#DAA520" stroke-width="3"/>
  
  <!-- Beak (aged, distinguished) -->
  <path d="M65 62 L75 82 L85 62 Q75 58 65 62" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  <line x1="75" y1="65" x2="75" y2="75" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Ear Tufts (wise, long) -->
  <path d="M40 10 L30 -10 L42 5" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  <path d="M48 8 L45 -5 L52 5" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  <path d="M110 10 L120 -10 L108 5" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  <path d="M102 8 L105 -5 L98 5" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Crown/Tiara of Wisdom -->
  <path d="M55 8 L60 -5 L70 5 L75 -8 L80 5 L90 -5 L95 8" fill="url(#wiseGold)" stroke="#2D3561" stroke-width="2"/>
  <circle cx="75" cy="-2" r="4" fill="#FF6B6B" stroke="#2D3561" stroke-width="1"/>
  
  <!-- Scroll in Wing -->
  <g transform="translate(5, 100) rotate(-10)">
    <rect x="0" y="0" width="35" height="45" fill="#F5DEB3" stroke="#8B7355" stroke-width="2"/>
    <rect x="3" y="3" width="29" height="37" fill="none" stroke="#8B7355" stroke-width="1"/>
    <line x1="6" y1="10" x2="28" y2="10" stroke="#8B7355" stroke-width="1"/>
    <line x1="6" y1="18" x2="28" y2="18" stroke="#8B7355" stroke-width="1"/>
    <line x1="6" y1="26" x2="25" y2="26" stroke="#8B7355" stroke-width="1"/>
  </g>
  
  <!-- Wise Smile -->
  <path d="M68 95 Q75 98 82 95" fill="none" stroke="#2D3561" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Star Sparkles (wisdom) -->
  <text x="12" y="45" font-family="serif" font-size="12" fill="#FFD93D">✦</text>
  <text x="128" y="50" font-family="serif" font-size="12" fill="#FFD93D">✦</text>
</svg>