<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88D8B0"/>
      <stop offset="100%" stop-color="#5BC0A8"/>
    </linearGradient>
    <linearGradient id="dragonBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F6F0"/>
      <stop offset="100%" stop-color="#C8E8D8"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#44A08D"/>
    </linearGradient>
  </defs>
  
  <!-- Back Wing -->
  <path d="M100 60 Q130 40 135 70 Q125 80 100 70" fill="url(#wingGrad)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="75" cy="95" rx="35" ry="40" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Belly -->
  <ellipse cx="75" cy="100" rx="22" ry="28" fill="url(#dragonBelly)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M40 110 Q20 120 15 100 Q10 90 20 95" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="2"/>
  <circle cx="15" cy="95" r="5" fill="#FF6B6B" stroke="#2D3561" stroke-width="1"/>
  
  <!-- Front Wing -->
  <path d="M50 65 Q20 45 15 75 Q25 85 50 75" fill="url(#wingGrad)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="75" cy="55" r="30" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Snout -->
  <ellipse cx="75" cy="68" rx="15" ry="10" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="2"/>
  <ellipse cx="75" cy="65" rx="10" ry="6" fill="#E8F6F0" stroke="#2D3561" stroke-width="1"/>
  
  <!-- Nostrils -->
  <circle cx="70" cy="65" r="2" fill="#2D3561"/>
  <circle cx="80" cy="65" r="2" fill="#2D3561"/>
  
  <!-- Eyes -->
  <circle cx="62" cy="50" r="10" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="62" cy="50" r="6" fill="#6B5B95"/>
  <circle cx="64" cy="48" r="3" fill="#FFFFFF"/>
  <circle cx="88" cy="50" r="10" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="88" cy="50" r="6" fill="#6B5B95"/>
  <circle cx="90" cy="48" r="3" fill="#FFFFFF"/>
  
  <!-- Horns -->
  <path d="M55 30 L50 15 L58 28" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
  <path d="M95 30 L100 15 L92 28" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Tiny Wings -->
  <path d="M35 75 Q20 65 25 85" fill="url(#wingGrad)" stroke="#2D3561" stroke-width="2"/>
  <path d="M115 75 Q130 65 125 85" fill="url(#wingGrad)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Baby Teeth -->
  <path d="M68 75 L70 78 L72 75" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
  <path d="M78 75 L80 78 L82 75" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
  
  <!-- Tiny Fire -->
  <ellipse cx="75" cy="82" rx="4" ry="3" fill="#FFD93D" opacity="0.6"/>
  
  <!-- Paws -->
  <ellipse cx="55" cy="125" rx="8" ry="6" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="2"/>
  <ellipse cx="95" cy="125" rx="8" ry="6" fill="url(#dragonBody)" stroke="#2D3561" stroke-width="2"/>
</svg>