<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scrollPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Background parchment color -->
      <rect width="80" height="80" fill="#FAF5E6"/>
      
      <!-- Subtle scroll silhouette -->
      <g opacity="0.08">
        <!-- Scroll roll left -->
        <ellipse cx="20" cy="40" rx="8" ry="20" fill="#8B7355"/>
        <rect x="20" y="20" width="30" height="40" fill="#F5DEB3"/>
        <!-- Scroll roll right -->
        <ellipse cx="50" cy="40" rx="8" ry="20" fill="#8B7355"/>
        <!-- Scroll curl lines -->
        <path d="M28 25 Q40 22 52 25" fill="none" stroke="#8B7355" stroke-width="0.5"/>
        <path d="M28 35 Q40 32 52 35" fill="none" stroke="#8B7355" stroke-width="0.5"/>
        <path d="M28 45 Q40 42 52 45" fill="none" stroke="#8B7355" stroke-width="0.5"/>
        <path d="M28 55 Q40 52 52 55" fill="none" stroke="#8B7355" stroke-width="0.5"/>
      </g>
      
      <!-- Faint quill icon -->
      <g opacity="0.06" transform="translate(60, 60)">
        <path d="M0 15 Q5 5 10 0 Q8 8 5 15" fill="#654321"/>
        <ellipse cx="2" cy="16" rx="3" ry="2" fill="#8B4513"/>
      </g>
      
      <!-- Vintage ink blot -->
      <g opacity="0.04">
        <circle cx="10" cy="70" r="3" fill="#2D3561"/>
        <circle cx="12" cy="72" r="2" fill="#2D3561"/>
        <circle cx="8" cy="73" r="1.5" fill="#2D3561"/>
      </g>
      
      <!-- Wax seal hint -->
      <g opacity="0.05" transform="translate(65, 15)">
        <circle cx="0" cy="0" r="6" fill="#8B0000"/>
        <text x="0" y="3" font-family="serif" font-size="6" text-anchor="middle" fill="#FFFFFF">★</text>
      </g>
    </pattern>
  </defs>
  
  <rect width="100" height="100" fill="url(#scrollPattern)"/>
  
  <!-- Edge aging effect -->
  <rect x="0" y="0" width="100" height="2" fill="#8B7355" opacity="0.1"/>
  <rect x="0" y="98" width="100" height="2" fill="#8B7355" opacity="0.1"/>
  <rect x="0" y="0" width="2" height="100" fill="#8B7355" opacity="0.1"/>
  <rect x="98" y="0" width="2" height="100" fill="#8B7355" opacity="0.1"/>
</svg>