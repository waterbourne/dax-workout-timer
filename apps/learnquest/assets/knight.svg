<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#A0A0A0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0C5"/>
      <stop offset="100%" stop-color="#E8B5A8"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#EE5A5A"/>
    </linearGradient>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>
  
  <!-- Cape -->
  <path d="M60 160 Q40 180 35 200 L165 200 Q160 180 140 160 Q100 140 60 160" fill="url(#capeGrad)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Body/Armor -->
  <path d="M60 100 L50 180 L150 180 L140 100 Q100 90 60 100" fill="url(#armorGrad)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Chest Emblem -->
  <rect x="75" y="120" width="50" height="40" rx="5" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
  <text x="100" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2D3561">⚔</text>
  
  <!-- Helmet -->
  <ellipse cx="100" cy="70" rx="45" ry="50" fill="url(#helmetGrad)" stroke="#2D3561" stroke-width="3"/>
  <ellipse cx="100" cy="70" rx="35" ry="40" fill="#4A4A4A" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Face Opening -->
  <path d="M75 55 L75 85 Q100 95 125 85 L125 55 Q100 50 75 55" fill="url(#skinGrad)" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="70" r="6" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="90" cy="70" r="3" fill="#4ECDC4"/>
  <circle cx="110" cy="70" r="6" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="110" cy="70" r="3" fill="#4ECDC4"/>
  
  <!-- Smile -->
  <path d="M92 82 Q100 88 108 82" fill="none" stroke="#2D3561" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Helmet Plume -->
  <path d="M70 25 Q100 5 130 25" fill="#FF6B6B" stroke="#2D3561" stroke-width="2"/>
  <path d="M80 20 L85 35" fill="none" stroke="#FF6B6B" stroke-width="6"/>
  <path d="M95 18 L100 35" fill="none" stroke="#FF6B6B" stroke-width="6"/>
  <path d="M110 20 L115 35" fill="none" stroke="#FF6B6B" stroke-width="6"/>
  
  <!-- Sword -->
  <g transform="translate(160, 80) rotate(15)">
    <rect x="-8" y="0" width="16" height="70" fill="url(#swordGrad)" stroke="#2D3561" stroke-width="2"/>
    <rect x="-25" y="65" width="50" height="8" fill="#FFD93D" stroke="#2D3561" stroke-width="2"/>
    <rect x="-10" y="70" width="20" height="25" fill="#8B4513" stroke="#2D3561" stroke-width="2"/>
  </g>
  
  <!-- Shoulder Armor -->
  <ellipse cx="55" cy="110" rx="15" ry="20" fill="url(#helmetGrad)" stroke="#2D3561" stroke-width="3"/>
  <ellipse cx="145" cy="110" rx="15" ry="20" fill="url(#helmetGrad)" stroke="#2D3561" stroke-width="3"/>
</svg>