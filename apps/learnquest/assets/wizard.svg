<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5B95"/>
      <stop offset="100%" stop-color="#4A4E8C"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0C5"/>
      <stop offset="100%" stop-color="#E8B5A8"/>
    </linearGradient>
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0E6D2"/>
      <stop offset="100%" stop-color="#D4C5B0"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#44A08D"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F9CA24"/>
    </linearGradient>
  </defs>
  
  <!-- Wizard Robe -->
  <path d="M50 100 L35 200 L165 200 L150 100 Q100 85 50 100" fill="url(#robeGrad)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Robe Trim -->
  <path d="M50 100 Q100 85 150 100" fill="none" stroke="#FFD93D" stroke-width="3"/>
  <rect x="85" y="110" width="30" height="80" fill="#FFD93D" opacity="0.3" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="75" r="38" fill="url(#skinGrad)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Beard -->
  <path d="M70 85 Q65 100 70 120 Q100 140 130 120 Q135 100 130 85" fill="url(#beardGrad)" stroke="#B8A898" stroke-width="2"/>
  <ellipse cx="80" cy="90" rx="8" ry="10" fill="url(#beardGrad)" stroke="#B8A898" stroke-width="2"/>
  <ellipse cx="120" cy="90" rx="8" ry="10" fill="url(#beardGrad)" stroke="#B8A898" stroke-width="2"/>
  
  <!-- Face -->
  <circle cx="88" cy="70" r="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="88" cy="70" r="4" fill="#4ECDC4"/>
  <circle cx="112" cy="70" r="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="2"/>
  <circle cx="112" cy="70" r="4" fill="#4ECDC4"/>
  
  <!-- Glasses -->
  <circle cx="88" cy="70" r="10" fill="none" stroke="#2D3561" stroke-width="2"/>
  <circle cx="112" cy="70" r="10" fill="none" stroke="#2D3561" stroke-width="2"/>
  <line x1="98" y1="70" x2="102" y2="70" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="82" rx="5" ry="4" fill="#E8B5A8" stroke="#2D3561" stroke-width="1"/>
  
  <!-- Smile -->
  <path d="M92 95 Q100 100 108 95" fill="none" stroke="#2D3561" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Wizard Hat -->
  <path d="M55 45 L100 -20 L145 45 Q100 55 55 45" fill="url(#hatGrad)" stroke="#2D3561" stroke-width="3"/>
  <rect x="45" y="40" width="110" height="15" rx="5" fill="#3AA688" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Hat Stars -->
  <text x="100" y="20" font-family="serif" font-size="12" fill="#FFD93D">★</text>
  <text x="85" y="30" font-family="serif" font-size="10" fill="#FFD93D">★</text>
  <text x="115" y="28" font-family="serif" font-size="10" fill="#FFD93D">★</text>
  
  <!-- Book Staff -->
  <rect x="140" y="80" width="8" height="120" fill="#8B4513" stroke="#2D3561" stroke-width="2"/>
  <g transform="translate(125, 50)">
    <rect x="0" y="0" width="40" height="55" rx="3" fill="url(#bookGrad)" stroke="#2D3561" stroke-width="2"/>
    <rect x="5" y="5" width="30" height="40" fill="#FFF5E6" stroke="#2D3561" stroke-width="1"/>
    <line x1="20" y1="5" x2="20" y2="45" stroke="#2D3561" stroke-width="2"/>
    <text x="10" y="20" font-family="serif" font-size="8" fill="#2D3561">A</text>
    <text x="25" y="30" font-family="serif" font-size="8" fill="#2D3561">B</text>
    <text x="10" y="35" font-family="serif" font-size="8" fill="#2D3561">C</text>
  </g>
  
  <!-- Floating Letters -->
  <text x="30" y="40" font-family="serif" font-size="18" font-weight="bold" fill="#FFD93D" stroke="#2D3561" stroke-width="1">A</text>
  <text x="170" y="55" font-family="serif" font-size="18" font-weight="bold" fill="#4ECDC4" stroke="#2D3561" stroke-width="1">B</text>
  <text x="15" y="90" font-family="serif" font-size="18" font-weight="bold" fill="#FF6B6B" stroke="#2D3561" stroke-width="1">C</text>
  
  <!-- Magic Sparkles -->
  <circle cx="30" cy="30" r="3" fill="#FFD93D"/>
  <circle cx="175" cy="75" r="3" fill="#4ECDC4"/>
  <circle cx="25" cy="120" r="3" fill="#FF6B6B"/>
</svg>