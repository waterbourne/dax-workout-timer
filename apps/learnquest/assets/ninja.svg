<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ninjaDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3561"/>
      <stop offset="100%" stop-color="#1a1f3d"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0C5"/>
      <stop offset="100%" stop-color="#E8B5A8"/>
    </linearGradient>
    <linearGradient id="shurikenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#44A08D"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F9CA24"/>
    </linearGradient>
  </defs>
  
  <!-- Ninja Outfit Body -->
  <path d="M60 90 L40 180 L160 180 L140 90 Q100 80 60 90" fill="url(#ninjaDark)" stroke="#1a1f3d" stroke-width="3"/>
  
  <!-- Ninja Belt -->
  <rect x="55" y="130" width="90" height="15" fill="#FF6B6B" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="65" r="40" fill="url(#skinGrad)" stroke="#2D3561" stroke-width="3"/>
  
  <!-- Ninja Mask -->
  <path d="M60 45 L60 85 Q100 95 140 85 L140 45 Q100 40 60 45" fill="url(#ninjaDark)" stroke="#1a1f3d" stroke-width="2"/>
  <path d="M58 45 L58 95 Q100 105 142 95 L142 45" fill="none" stroke="#2D3561" stroke-width="2"/>
  
  <!-- Eyes -->
  <path d="M75 68 L92 68" stroke="#4ECDC4" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 68 L125 68" stroke="#4ECDC4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="83" cy="68" r="4" fill="#FFFFFF"/>
  <circle cx="117" cy="68" r="4" fill="#FFFFFF"/>
  
  <!-- Headband -->
  <rect x="55" y="35" width="90" height="18" fill="#FF6B6B" stroke="#2D3561" stroke-width="2"/>
  <text x="100" y="49" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2D3561">MATH</text>
  
  <!-- Headband Ties -->
  <path d="M145 44 Q160 35 165 50" fill="none" stroke="#FF6B6B" stroke-width="4"/>
  <path d="M145 44 Q155 55 165 45" fill="none" stroke="#FF6B6B" stroke-width="4"/>
  
  <!-- Math Shurikens -->
  <g transform="translate(30, 50)">
    <polygon points="0,15 10,5 15,15 25,10 15,20 20,30 10,22 0,30 5,20" fill="url(#shurikenGrad)" stroke="#2D3561" stroke-width="2"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2D3561">+</text>
  </g>
  
  <g transform="translate(160, 60)">
    <polygon points="0,12 8,4 12,12 20,8 12,16 16,24 8,18 0,24 4,16" fill="url(#shurikenGrad)" stroke="#2D3561" stroke-width="2"/>
    <text x="10" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#2D3561">×</text>
  </g>
  
  <g transform="translate(25, 130)">
    <polygon points="0,12 8,4 12,12 20,8 12,16 16,24 8,18 0,24 4,16" fill="url(#shurikenGrad)" stroke="#2D3561" stroke-width="2"/>
    <text x="10" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#2D3561">÷</text>
  </g>
  
  <g transform="translate(165, 140)">
    <polygon points="0,12 8,4 12,12 20,8 12,16 16,24 8,18 0,24 4,16" fill="url(#shurikenGrad)" stroke="#2D3561" stroke-width="2"/>
    <text x="10" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#2D3561">-</text>
  </g>
  
  <!-- Calculator in Hand -->
  <g transform="translate(70, 170) rotate(-10)">
    <rect x="0" y="0" width="40" height="50" rx="5" fill="url(#calcGrad)" stroke="#2D3561" stroke-width="2"/>
    <rect x="5" y="5" width="30" height="12" fill="#2D3561"/>
    <rect x="7" y="20" width="8" height="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
    <rect x="18" y="20" width="8" height="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
    <rect x="29" y="20" width="8" height="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
    <rect x="7" y="30" width="8" height="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
    <rect x="18" y="30" width="8" height="8" fill="#FFFFFF" stroke="#2D3561" stroke-width="1"/>
    <rect x="29" y="30" width="8" height="8" fill="#FF6B6B" stroke="#2D3561" stroke-width="1"/>
  </g>
  
  <!-- Numbers floating -->
  <text x="45" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFD93D" stroke="#2D3561" stroke-width="1">7</text>
  <text x="155" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4ECDC4" stroke="#2D3561" stroke-width="1">9</text>
  <text x="15" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF6B6B" stroke="#2D3561" stroke-width="1">=</text>
</svg>