<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="starsPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="100" height="100" fill="#1a1f3d"/>
      
      <!-- Stars of various sizes -->
      <circle cx="10" cy="15" r="1" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="30" cy="8" r="1.5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="50" cy="20" r="1" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="70" cy="12" r="1.2" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="90" cy="25" r="1" fill="#FFFFFF" opacity="0.5"/>
      
      <circle cx="15" cy="40" r="1.5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="45" cy="35" r="1" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="65" cy="45" r="1.3" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="85" cy="38" r="1" fill="#FFFFFF" opacity="0.9"/>
      
      <circle cx="5" cy="60" r="1" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="35" cy="55" r="1.4" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="55" cy="65" r="1" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="75" cy="58" r="1.5" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="95" cy="70" r="1" fill="#FFFFFF" opacity="0.9"/>
      
      <circle cx="20" cy="80" r="1.2" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="50" cy="75" r="1" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="80" cy="85" r="1.3" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="40" cy="90" r="1" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="60" cy="95" r="1.5" fill="#FFFFFF" opacity="0.6"/>
      
      <!-- Brighter stars with sparkle -->
      <circle cx="25" cy="25" r="2" fill="#FFD93D" opacity="0.7"/>
      <path d="M25 22 L25 23 M25 27 L25 28 M22 25 L23 25 M27 25 L28 25" stroke="#FFD93D" stroke-width="1"/>
      
      <circle cx="75" cy="75" r="2" fill="#4ECDC4" opacity="0.6"/>
      <path d="M75 72 L75 73 M75 77 L75 78 M72 75 L73 75 M77 75 L78 75" stroke="#4ECDC4" stroke-width="1"/>
      
      <circle cx="75" cy="25" r="1.8" fill="#FF6B6B" opacity="0.6"/>
      <circle cx="25" cy="75" r="1.8" fill="#FFFFFF" opacity="0.8"/>
    </pattern>
  </defs>
  
  <rect width="100" height="100" fill="url(#starsPattern)"/>
</svg>