    notes: "Craigslist goldmine, motivated sellers"

# Telegram delivery settings
telegram:
  target: "8584092724"
  min_confidence: "medium"   # low / medium / high
  only_buy: false             # true = only send BUY, false = send BUY + INVESTIGATE

# Scan settings
scan:
  interval_minutes: 30
  max_results_per_search: 25
  fetch_full_descriptions: true   # Slower but more accurate AI analysis
  dedup_window_hours: 24          # Don't re-alert same listing within 24h
