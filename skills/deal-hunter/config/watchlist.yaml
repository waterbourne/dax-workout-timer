# Deal Hunter Watchlist
# Add items you want to monitor for arbitrage opportunities

watches:
  - name: "iPhone 14 Pro"
    search: "iPhone 14 Pro"
    max_price: 500
    min_margin: 35
    platforms: [craigslist, ebay]
    category: phones
    notes: "Good liquid market, easy to ship"

  - name: "iPhone 13 Pro"
    search: "iPhone 13 Pro"
    max_price: 380
    min_margin: 35
    platforms: [craigslist, ebay]
    category: phones

  - name: "MacBook Air M1"
    search: "MacBook Air M1"
    max_price: 600
    min_margin: 30
    platforms: [craigslist, ebay]
    category: computers
    notes: "High value, easy to sell"

  - name: "MacBook Air M2"
    search: "MacBook Air M2"
